services:
  db:
    image: postgres:16
    container_name: heart_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: heart_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d heart_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Optional: run the Streamlit app in Docker too (`docker compose up --build`).
  # Requires models/xgb_model.joblib to exist (run train_model.py first).
  app:
    build: .
    container_name: heart_app
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg2://postgres:postgres@db:5432/heart_db
    ports:
      - "8501:8501"
    volumes:
      - ./models:/app/models

volumes:
  pgdata:
